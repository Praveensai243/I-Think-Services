<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Receptionist — Live Demo | I Think Services</title>
<style>
  :root{
    --bg:#05070E;--surface:#0C1122;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);
    --text:#EDF1FF;--muted:#9AA6C9;--dim:#616E93;--brand:#5B84FF;--brand2:#8A5CFF;
    --flow:#22E8B6;--live:#FF5D73;--gold:#FFC46B;
    --f:"Inter",system-ui,-apple-system,sans-serif;--fm:"JetBrains Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f);line-height:1.5;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;
    background-image:radial-gradient(50vw 50vw at 80% -10%,rgba(34,232,182,.10),transparent 60%),
      radial-gradient(50vw 50vw at 0% 0%,rgba(91,132,255,.16),transparent 60%)}
  .wrap{width:100%;max-width:560px;padding:26px 20px 60px}
  header{display:flex;align-items:center;gap:11px;margin:6px 0 22px}
  header svg{width:32px;height:32px}
  header b{font-weight:600}header span{color:var(--muted)}
  .card{background:linear-gradient(180deg,rgba(16,24,46,.9),rgba(8,11,22,.9));border:1px solid var(--line);
    border-radius:24px;overflow:hidden;box-shadow:0 40px 90px -30px rgba(0,0,0,.75)}
  .bar{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);
    background:rgba(255,255,255,.02)}
  .ava{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:0 0 auto;
    background:linear-gradient(135deg,var(--brand),var(--flow));color:#04121d;font-weight:700}
  .bar .who{font-weight:600}.bar .st{font-family:var(--fm);font-size:.68rem;color:var(--flow);
    display:flex;align-items:center;gap:6px;margin-top:2px}
  .bar .st i{width:6px;height:6px;border-radius:50%;background:var(--flow);box-shadow:0 0 8px var(--flow)}
  .chat{padding:20px 18px;display:flex;flex-direction:column;gap:12px;min-height:300px;max-height:52vh;overflow-y:auto}
  .msg{max-width:85%;padding:11px 14px;border-radius:15px;font-size:.95rem}
  .msg.you{align-self:flex-end;background:#16213C;border:1px solid var(--line2);border-bottom-right-radius:5px}
  .msg.ai{align-self:flex-start;background:linear-gradient(135deg,rgba(91,132,255,.16),rgba(34,232,182,.1));
    border:1px solid rgba(91,132,255,.28);border-bottom-left-radius:5px}
  .msg .lbl{font-family:var(--fm);font-size:.56rem;letter-spacing:.12em;text-transform:uppercase;
    color:var(--dim);display:block;margin-bottom:3px}
  .action{align-self:flex-start;max-width:88%;background:rgba(34,232,182,.07);border:1px solid rgba(34,232,182,.3);
    border-radius:14px;padding:11px 13px;font-size:.85rem;font-family:var(--fm);color:var(--flow)}
  .action.warm{background:rgba(255,196,107,.07);border-color:rgba(255,196,107,.35);color:var(--gold)}
  .typing{align-self:flex-start;display:flex;gap:5px;padding:12px 15px;border-radius:15px;
    background:rgba(255,255,255,.04);border:1px solid var(--line)}
  .typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
  .foot{padding:16px 18px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
  .mic{width:58px;height:58px;flex:0 0 auto;border:none;border-radius:50%;cursor:pointer;
    background:linear-gradient(135deg,var(--brand),var(--flow));display:grid;place-items:center;
    box-shadow:0 10px 30px -8px rgba(34,232,182,.5);transition:transform .2s}
  .mic:hover{transform:translateY(-2px)}
  .mic.live{background:var(--live);box-shadow:0 0 0 0 rgba(255,93,115,.5);animation:pulse 1.3s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,93,115,.5)}100%{box-shadow:0 0 0 18px rgba(255,93,115,0)}}
  .mic svg{width:24px;height:24px;fill:#04121d}
  .mic.live svg{fill:#fff}
  form{flex:1;display:flex;gap:8px}
  input[type=text]{flex:1;background:#080B16;border:1px solid var(--line2);border-radius:12px;
    padding:12px 14px;color:var(--text);font-family:var(--f);font-size:.95rem}
  input:focus{outline:none;border-color:var(--flow)}
  .send{background:rgba(255,255,255,.04);border:1px solid var(--line2);border-radius:12px;color:var(--text);
    padding:0 14px;cursor:pointer;font-weight:600}
  .hint{color:var(--dim);font-family:var(--fm);font-size:.72rem;text-align:center;margin-top:16px;line-height:1.7}
  .hint b{color:var(--muted);font-weight:500}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
  .chip{font-size:.78rem;font-family:var(--fm);color:var(--muted);border:1px solid var(--line);
    border-radius:999px;padding:7px 12px;cursor:pointer;background:none}
  .chip:hover{border-color:var(--flow);color:var(--text)}
  .demo-flag{font-family:var(--fm);font-size:.66rem;color:var(--gold);text-align:center;margin-top:10px}
</style></head>
<body>
<div class="wrap">
  <header>
    <svg viewBox="0 0 32 32" fill="none"><rect x="1" y="1" width="30" height="30" rx="9" stroke="url(#g)" stroke-width="1.5"/>
      <circle cx="9" cy="16" r="2.5" fill="#5B84FF"/><circle cx="23" cy="9" r="2.5" fill="#22E8B6"/>
      <circle cx="23" cy="23" r="2.5" fill="#8A5CFF"/><path d="M11 15 L21 10 M11 17 L21 22" stroke="url(#g)" stroke-width="1.7" stroke-linecap="round"/>
      <defs><linearGradient id="g" x1="0" y1="0" x2="32" y2="32"><stop stop-color="#5B84FF"/><stop offset=".5" stop-color="#8A5CFF"/><stop offset="1" stop-color="#22E8B6"/></linearGradient></defs></svg>
    <div><b>I Think</b> <span>Services</span></div>
  </header>

  <div class="card">
    <div class="bar">
      <span class="ava" id="ava">AI</span>
      <div><div class="who" id="who">AI Receptionist</div><div class="st"><i></i><span id="status">Tap the mic and start talking</span></div></div>
    </div>
    <div class="chat" id="chat"></div>
    <div class="foot">
      <button class="mic" id="mic" aria-label="Talk">
        <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M19 11a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.92V21H8a1 1 0 0 0 0 2h8a1 1 0 0 0 0-2h-3v-3.08A7 7 0 0 0 19 11z"/></svg>
      </button>
      <form id="form"><input id="text" type="text" placeholder="…or type to the receptionist" autocomplete="off"><button class="send" type="submit">Send</button></form>
    </div>
  </div>

  <div class="chips" id="chips"></div>
  <div class="demo-flag" id="flag"></div>
  <p class="hint">Voice uses your browser's built-in speech (Chrome works best). <b>This is a live demo of the same agent that answers real phone calls.</b></p>
</div>

<script>
const $ = (s) => document.querySelector(s);
const chat = $("#chat"), statusEl = $("#status");
const sessionId = "web_" + Math.random().toString(36).slice(2);
let cfg = { name: "AI Receptionist", agentName: "the receptionist", greeting: "", services: [], brain: false };
let greeted = false;

// pick a natural voice for TTS
let voice = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v=>/female|samantha|jenny|aria|zira|google us english/i.test(v.name))
        || vs.find(v=>v.lang && v.lang.startsWith("en")) || vs[0] || null;
}
speechSynthesis.onvoiceschanged = pickVoice; pickVoice();

function speak(text){
  try{ speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    if(voice) u.voice = voice; u.rate = 1.03; u.pitch = 1.0;
    speechSynthesis.speak(u);
  }catch(e){}
}
function bubble(text, who){
  const d = document.createElement("div"); d.className = "msg " + who;
  d.innerHTML = `<span class="lbl">${who==="you"?"You":cfg.agentName}</span>` + escapeHtml(text);
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight; return d;
}
function actionCard(text, warm){
  const d = document.createElement("div"); d.className = "action" + (warm?" warm":"");
  d.textContent = text; chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
}
function typing(){ const d=document.createElement("div"); d.className="typing"; d.innerHTML="<i></i><i></i><i></i>"; chat.appendChild(d); chat.scrollTop=chat.scrollHeight; return d; }
function escapeHtml(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

async function loadConfig(){
  try{
    cfg = await (await fetch("/api/config")).json();
    $("#who").textContent = cfg.name + " · Receptionist";
    $("#flag").textContent = cfg.brain ? "" : "Demo mode: add ANTHROPIC_API_KEY on the server to make the agent talk.";
    const chips = ["I'd like to book a cleaning","What are your hours?","Do you take Delta Dental?","I need to reschedule"];
    const box = $("#chips");
    chips.forEach(c=>{ const b=document.createElement("button"); b.className="chip"; b.textContent=c;
      b.onclick=()=>send(c); box.appendChild(b); });
  }catch(e){}
}
loadConfig();

async function send(text){
  bubble(text, "you");
  const t = typing();
  try{
    const r = await fetch("/api/agent/turn", {method:"POST",headers:{"content-type":"application/json"},
      body: JSON.stringify({ sessionId, text })});
    const data = await r.json();
    t.remove();
    const reply = data.reply || "…";
    bubble(reply, "ai"); speak(reply);
    (data.actions||[]).forEach(a=>{
      if(a.tool==="book_appointment" && a.result.ok) actionCard("✓ Appointment booked — confirmation " + a.result.confirmation);
      if(a.tool==="reschedule_appointment" && a.result.ok) actionCard("✓ Appointment moved");
      if(a.tool==="cancel_appointment" && a.result.ok) actionCard("✓ Appointment cancelled");
      if(a.tool==="take_message" && a.result.ok) actionCard("✓ Message taken for the team");
    });
    if(data.transfer) actionCard("→ Transferring to a person: " + data.transfer.number, true);
  }catch(e){ t.remove(); bubble("Sorry, I couldn't reach the front desk just now.", "ai"); }
}

$("#form").addEventListener("submit", (e)=>{ e.preventDefault(); const v=$("#text").value.trim(); if(v){ $("#text").value=""; send(v);} });

// ── speech recognition (push to talk) ──────────────────────────
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const mic = $("#mic");
let rec = null, listening = false;

if(SR){
  rec = new SR(); rec.lang = "en-US"; rec.interimResults = true; rec.continuous = false;
  let finalText = "";
  rec.onresult = (e)=>{ finalText = ""; let interim="";
    for(let i=e.resultIndex;i<e.results.length;i++){ const r=e.results[i];
      if(r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript; }
    statusEl.textContent = (finalText || interim) || "Listening…";
  };
  rec.onend = ()=>{ setLive(false);
    const said = finalText.trim(); finalText="";
    if(said){ send(said); statusEl.textContent="Thinking…"; }
    else statusEl.textContent = "Tap the mic and start talking";
  };
  rec.onerror = ()=>{ setLive(false); statusEl.textContent="Mic error — try typing instead"; };
} else {
  mic.style.opacity=".5";
}

function setLive(on){ listening=on; mic.classList.toggle("live", on);
  statusEl.textContent = on ? "Listening…" : statusEl.textContent; }

mic.addEventListener("click", ()=>{
  if(!greeted && cfg.greeting){ greeted=true; bubble(cfg.greeting,"ai"); speak(cfg.greeting); }
  if(!SR){ $("#text").focus(); return; }
  if(listening){ rec.stop(); return; }
  speechSynthesis.cancel();
  try{ rec.start(); setLive(true); }catch(e){ /* already started */ }
});
</script>
</body></html>
